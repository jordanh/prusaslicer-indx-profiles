# INDX 0.4 mm standard-flow nozzle presets for flexibles Prusa has drafted
# but not released for the INDX, by hyiger.
# Generated by tools/derive_flex_filaments.py from PrusaResearch.ini 2.5.12.
# Import via File > Import > Import Config Bundle.
# NinjaTek NinjaFlex TPU: calibrated on an INDX (hyiger's calibration prints, CORE One INDX tool 8 with Bondtech's Standard Flow 0.4, PrusaSlicer 3.0.0-alpha12, 2026-11-09), calibration prints only, no finished part yet:
#   temperature = 230 (derived 238): temperature tower: 230 printed best; a calibration cube then printed cleanly at it
#   first_layer_temperature = 230 (derived 238): kept at the printing temperature; the calibration cube's first layer held on the 50 C bed
#   filament_max_volumetric_speed = 1.5 (derived 2.4): Erik's Flow Ratio test failed twice at the derived 2.4, its first layer running about 3.1 mm3/s past the cap, and the TPU tangled at the extruder gear; 1.5 rules speed out and the calibration cube printed cleanly. A floor rather than a measured limit
#   filament_retract_length = 0.2 (derived 1.5): SemiFlex's retraction-tower result, taken as the start for the softer 85A; the calibration cube printed cleanly with it. No retraction tower printed yet
#   filament_retract_speed = 25 (derived 60): lowered from the released 95A flexibles' 60 so the soft 85A is not pulled hard through the gear; the calibration cube printed cleanly with it. Not tested on its own
#   max_fan_speed = 55 (derived 50): set in hyiger's test preset; the calibration cube printed cleanly with it; no test recorded for it
#   bridge_fan_speed = 70 (derived 60): as max_fan_speed
# NinjaTek SemiFlex TPU: calibrated on an INDX (hyiger's calibration prints, CORE One INDX tool 8 with Bondtech's Standard Flow 0.4, PrusaSlicer 3.0.0-alpha12, 2026-11-07/08), calibration prints only, no finished part yet:
#   temperature = 225 (derived 240): temperature tower: 225 printed best
#   first_layer_temperature = 225 (derived 240): kept at the printing temperature; the hotter bed gave the first layer its grip
#   bed_temperature = 60 (derived 50): Flow Ratio coupons warped at the corners and one came free at 50; the retry at 60, Prusa's Generic FLEX @COREONEINDX HF0.4 bed, held
#   first_layer_bed_temperature = 60 (derived 50): as bed_temperature
#   extrusion_multiplier = 1.15 (derived 1.08): Flow Ratio pads 1.04-1.20 in steps of 0.02: 1.14 and 1.16 best, split
#   filament_max_volumetric_speed = 3.6 (derived 1.6): flow tower 1-4.5 mm3/s showed no clear failure band; 80% of 4.5, a floor rather than a measured limit
#   filament_retract_length = 0.2 (derived 1.5): retraction tower: least stringing at band 2 (0.2 mm), more at every longer length
#   min_fan_speed = 25 (derived 45): lowered from 45 against the corner curl on the first Flow Ratio coupons
#   max_fan_speed = 25 (derived 45): as min_fan_speed
#   bridge_fan_speed = 66 (derived 70): set in hyiger's calibrated preset; no test recorded for it
# Binding: standard-flow 0.4 only: Prusa's INDX flexibles bind on diameter alone and so also reach the HF0.4 CHT, but Bondtech sells the standard-flow tool for soft TPU because it drops the CHT core splitter and its back-pressure.
# Taken from Prusa's released INDX flexibles (Generic FLEX @COREONEINDX HF0.4, Prusament TPU 95A @COREONEINDX HF0.4):
#   start_filament_gcode: adds Prusa's INDX flex line M906 P2 (extruder motor current) to *C1INDX_FLEX_PA*'s M572 S0, which is all the drafts carry
#   filament_multitool_ramming_flow: 2 mm3/s: the drafts resolve to *C1INDX_common*'s 30, a PLA ramming rate no flexible can follow
#   filament_minimal_purge_on_wipe_tower: Prusa's INDX flex purge, 15 over the common's 10
#   filament_retract_length: Prusa's INDX flex retraction (the drafts carry 3-3.5 from their MK4 parents)
#   filament_retract_speed: Prusa's INDX flex retraction
#   filament_deretract_speed: Prusa's INDX flex retraction
#   filament_retract_layer_change: Prusa's INDX flex retraction: none on layer change
#   filament_travel_ramping_lift: off on both released INDX flexibles; the drafts leave it to the printer, which ramps

[filament:NinjaTek NinjaFlex TPU @COREONEINDX 0.4]
bed_temperature = 50
bridge_fan_speed = 70
chamber_minimal_temperature = 0
chamber_temperature = 30
compatible_printers = 
compatible_printers_condition = printer_model=~/(COREONE_INDX8T|COREONE_INDX4T|COREONEL_INDX8T|COREONEL_INDX4T)/ and nozzle_diameter[0]==0.4 and ! nozzle_high_flow[0]
compatible_prints_condition = notes!~/.*HT_HOTEND_HT.*/
cooling = 1
disable_fan_first_layers = 1
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 1.12
fan_always_on = 1
fan_below_layer_time = 100
filament_colour = #008000
filament_cooling_final_speed = 0
filament_cooling_initial_speed = 0
filament_cooling_moves = 0
filament_cost = 85
filament_density = 1.19
filament_deretract_speed = 20
filament_diameter = 1.75
filament_load_time = 9
filament_loading_speed = 0
filament_loading_speed_start = 0
filament_max_volumetric_speed = 1.5
filament_minimal_purge_on_wipe_tower = 15
filament_multitool_ramming = 1
filament_multitool_ramming_flow = 2
filament_multitool_ramming_volume = 18
filament_notes = "INDX 0.4 standard-flow preset from Prusa's draft NinjaTek NinjaFlex TPU @COREONEINDX, resolved: Prusa's own unreleased INDX draft for NinjaFlex (85A). As Prusa's released INDX flexibles: start_filament_gcode, filament_multitool_ramming_flow, filament_minimal_purge_on_wipe_tower, filament_retract_length, filament_travel_ramping_lift. MVS 2.4 = 3 (NinjaTek NinjaFlex TPU @COREONE) x 0.8, the INDX / CORE One ratio of both Generic FLEX @COREONEINDX HF0.4 and Prusament TPU 95A @COREONEINDX HF0.4; the draft types 3. Maker range: within ninjatek.com/shop/ninjaflex and ninjatek.com/printing-guidelines (MVS = 18 mm/s at 0.45 x 0.20 mm). Calibrated, from hyiger's calibration prints, CORE One INDX tool 8 with Bondtech's Standard Flow 0.4, PrusaSlicer 3.0.0-alpha12, 2026-11-09: temperature 230 (derived 238): temperature tower: 230 printed best; a calibration cube then printed cleanly at it; first_layer_temperature 230 (derived 238): kept at the printing temperature; the calibration cube's first layer held on the 50 C bed; filament_max_volumetric_speed 1.5 (derived 2.4): Erik's Flow Ratio test failed twice at the derived 2.4, its first layer running about 3.1 mm3/s past the cap, and the TPU tangled at the extruder gear; 1.5 rules speed out and the calibration cube printed cleanly. A floor rather than a measured limit; filament_retract_length 0.2 (derived 1.5): SemiFlex's retraction-tower result, taken as the start for the softer 85A; the calibration cube printed cleanly with it. No retraction tower printed yet; filament_retract_speed 25 (derived 60): lowered from the released 95A flexibles' 60 so the soft 85A is not pulled hard through the gear; the calibration cube printed cleanly with it. Not tested on its own; max_fan_speed 55 (derived 50): set in hyiger's test preset; the calibration cube printed cleanly with it; no test recorded for it; bridge_fan_speed 70 (derived 60): as max_fan_speed. No finished part printed yet."
filament_purge_multiplier = 100%
filament_ramming_parameters = "120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6"
filament_retract_before_travel = 2
filament_retract_layer_change = 0
filament_retract_length = 0.2
filament_retract_lift = 0
filament_retract_speed = 25
filament_settings_id = 
filament_soluble = 0
filament_stamping_distance = 0
filament_stamping_loading_speed = 0
filament_toolchange_delay = 0
filament_travel_max_lift = 0.6
filament_travel_ramping_lift = 0
filament_type = FLEX
filament_unload_time = 3.5
filament_unloading_speed = 0
filament_unloading_speed_start = 0
filament_vendor = NinjaTek
filament_wipe = 0
first_layer_bed_temperature = 50
first_layer_temperature = 230
full_fan_speed_layer = 3
idle_temperature = nil
max_fan_speed = 55
min_fan_speed = 40
min_print_speed = 10
slowdown_below_layer_time = 10
start_filament_gcode = "M572 S0 ; Pressure advance\n\nM906 P2 ; set E current"
temperature = 230

