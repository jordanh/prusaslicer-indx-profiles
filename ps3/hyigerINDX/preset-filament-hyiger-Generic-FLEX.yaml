# UNVALIDATED: nothing in this vendor has been printed with PrusaSlicer 3 yet.
# Generic FLEX for the INDX at the tool-8 sizes Prusa has no PS3 profile for.
# Generated by tools/build_ps3_vendor.py from this repo's 2.9 bundles, key
# for key (port_filament()): bookkeeping dropped, filament_retract_* and the
# like renamed to the plain keys PrusaSlicer 3 uses, and the M572/M573 start
# G-code turned into pressure_advance / pressure_advance_value.
#   Generic FLEX @COREONEINDX HF0.6: filaments/hyigerINDX-0.6-filaments.ini (provenance in its filament_notes)
#     renamed: filament_deretract_speed, filament_retract_before_travel, filament_retract_layer_change, filament_retract_length, filament_retract_lift, filament_retract_restart_extra_toolchange, filament_retract_speed, filament_travel_max_lift, filament_travel_ramping_lift, filament_wipe
kind: filament
id: EHVYjvQsVUWYihZc2i1MSw
name: Generic FLEX
condition: printer.base_model == "COREONE_INDX"
features:
  $.type: TPU
variants:
- condition: tool.nozzle_diameter == 0.6 and tool.nozzle_high_flow
  name: Generic FLEX @COREONEINDX HF0.6
  id: BBurHwMdWHeMHGZXQqUzrg
  values:
    bed_temperature: 60
    bridge_fan_speed: 70
    chamber_minimal_temperature: 0
    chamber_temperature: 30
    cooling: false
    disable_fan_first_layers: 3
    end_filament_gcode: "; Filament-specific end gcode"
    extrusion_multiplier: 1.08
    fan_always_on: true
    fan_below_layer_time: 100
    filament_colour: "#008000"
    filament_cooling_final_speed: 0
    filament_cooling_initial_speed: 0
    filament_cooling_moves: 0
    filament_cost: 82
    filament_density: 1.22
    deretract_speed: 20
    filament_diameter: 1.75
    filament_loading_speed: 0
    filament_loading_speed_start: 0
    filament_max_volumetric_speed: 3
    filament_minimal_purge_on_wipe_tower: 15
    filament_multitool_ramming: true
    filament_multitool_ramming_flow: 2
    filament_multitool_ramming_volume: 18
    filament_notes: "INDX 0.6 seed. Base: Generic FLEX @COREONEINDX HF0.4. MVS 2 -> 3 via CORE One 0.4->0.6 (non-HF) (x1.40). PA 0 kept from 0.4: *C1INDX_FLEX_PA* is nozzle independent upstream. *C1INDX_06_common*: own filament_minimal_purge_on_wipe_tower 15 kept over 14; filament_retract_restart_extra_toolchange unset -> 0.04. Prusa nozzle ratio applied to a Bondtech CHT - re-measure MVS and PA."
    filament_purge_multiplier: 100%
    filament_ramming_parameters: 120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6
    retract_before_travel: 2
    retract_layer_change: false
    retract_length: 1.5
    retract_lift: 0
    retract_restart_extra_toolchange: 0.04
    retract_speed: 60
    filament_soluble: false
    filament_stamping_distance: 0
    filament_stamping_loading_speed: 0
    filament_toolchange_delay: 0
    travel_max_lift: 0.6
    travel_ramping_lift: false
    filament_type: FLEX
    filament_unloading_speed: 0
    filament_unloading_speed_start: 0
    filament_vendor: Generic
    wipe: false
    first_layer_bed_temperature: 60
    first_layer_temperature: 220
    full_fan_speed_layer: 5
    max_fan_speed: 50
    min_fan_speed: 50
    min_print_speed: 15
    slowdown_below_layer_time: 10
    pressure_advance: disabled
    start_filament_gcode: |-
      M572 S0 ; Pressure advance

      M906 P2 ; set E current
    temperature: 220
- name: "*quit*"
  id: IGqY1bu3UzOAwLZs3IX5AQ
