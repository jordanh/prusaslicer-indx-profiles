    filament_notes: "INDX 0.4 standard-flow preset from Prusa's draft Fillamentum Flexfill 98A @COREONEINDX, resolved: Prusa had one profile for both 98A TPUs, 'SemiFlex or Flexfill 98A' (SemiFlex's renamed_from), and identical EM 1.12 and MVS 1.35 after the split; it has no SemiFlex profile newer than the MK3 era, so the INDX draft for Flexfill 98A stands in. As Prusa's released INDX flexibles: start_filament_gcode, filament_multitool_ramming_flow, filament_minimal_purge_on_wipe_tower, filament_retract_length, filament_travel_ramping_lift. MVS 1.6 = 2 (Fillamentum Flexfill 98A @COREONE) x 0.8, the INDX / CORE One ratio of both Generic FLEX @COREONEINDX HF0.4 and Prusament TPU 95A @COREONEINDX HF0.4; the draft types 2. Constants from Prusa's SemiFlex: filament_density 1.22, filament_cost 82.26, filament_spool_weight unset. Vendor NinjaTek: the material is NinjaTek SemiFlex; Prusa labels its SemiFlex Generic because it once covered Flexfill 98A too. Maker range: no maker range published. Calibrated, from hyiger's calibration prints, CORE One INDX tool 8 with Bondtech's Standard Flow 0.4, PrusaSlicer 3.0.0-alpha12, 2026-11-07/08: temperature 225 (derived 240): temperature tower: 225 printed best; first_layer_temperature 225 (derived 240): kept at the printing temperature; the hotter bed gave the first layer its grip; bed_temperature 60 (derived 50): Flow Ratio coupons warped at the corners and one came free at 50; the retry at 60, Prusa's Generic FLEX @COREONEINDX HF0.4 bed, held; first_layer_bed_temperature 60 (derived 50): as bed_temperature; extrusion_multiplier 1.15 (derived 1.08): Flow Ratio pads 1.04-1.20 in steps of 0.02: 1.14 and 1.16 best, split; filament_max_volumetric_speed 3.6 (derived 1.6): flow tower 1-4.5 mm3/s showed no clear failure band; 80% of 4.5, a floor rather than a measured limit; filament_retract_length 0.2 (derived 1.5): retraction tower: least stringing at band 2 (0.2 mm), more at every longer length; min_fan_speed 25 (derived 45): lowered from 45 against the corner curl on the first Flow Ratio coupons; max_fan_speed 25 (derived 45): as min_fan_speed; bridge_fan_speed 66 (derived 70): set in hyiger's calibrated preset; no test recorded for it. No finished part printed yet."
