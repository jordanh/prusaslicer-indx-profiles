# UNVALIDATED: nothing in this vendor has been printed with PrusaSlicer 3 yet.
# Prusa Research FFF 1.0.20 preset-tool-coreone-indx.yaml, copied by
# tools/build_ps3_vendor.py, with tool_print presets appended at the end:
#   0.07mm Extra Fine @COREONEINDX 0.4HF: values of 0.10mm Fine @COREONEINDX 0.4HF; tools 1-7 need a tool_print at 0.07 or a 0.25 tool 8 cannot print 0.07 (every tool needs one, PresetEvaluator.cpp:668-683); held from Prusa's nearest rung, 0.10 Fine, whose speeds give less flow at 0.07, not more
#   0.10mm Fine @COREONEINDX 0.4: Prusa's HF0.4 tool_print presets, unchanged: the repo's 2.9 standard-0.4 prints are Prusa's HF0.4 prints with only the binding changed
#   0.15mm Detail @COREONEINDX 0.4: Prusa's HF0.4 tool_print presets, unchanged: the repo's 2.9 standard-0.4 prints are Prusa's HF0.4 prints with only the binding changed
#   0.20mm Balanced ★ @COREONEINDX 0.4: Prusa's HF0.4 tool_print presets, unchanged: the repo's 2.9 standard-0.4 prints are Prusa's HF0.4 prints with only the binding changed
#   0.25mm Draft @COREONEINDX 0.4: Prusa's HF0.4 tool_print presets, unchanged: the repo's 2.9 standard-0.4 prints are Prusa's HF0.4 prints with only the binding changed
#   0.07mm Extra Fine @COREONEINDX 0.25: from '0.07mm Extra Fine @COREONEINDX 0.25'; Prusa's released INDX 0.25 prints in PrusaResearch.ini 2.5.12, test printed with this repo's 2.9 0.25 setup; Prusa's PS3 0.25 tool_print is still commented out
#   0.10mm Fine ★ @COREONEINDX 0.25: from '0.10mm Fine ★ @COREONEINDX 0.25'; Prusa's released INDX 0.25 prints in PrusaResearch.ini 2.5.12, test printed with this repo's 2.9 0.25 setup; Prusa's PS3 0.25 tool_print is still commented out
#   0.15mm Detail @COREONEINDX 0.25: from '0.15mm Detail @COREONEINDX 0.25'; Prusa's released INDX 0.25 prints in PrusaResearch.ini 2.5.12, test printed with this repo's 2.9 0.25 setup; Prusa's PS3 0.25 tool_print is still commented out
#   0.20mm Detail @COREONEINDX 0.6HF: from '0.20mm Detail @COREONEINDX HF0.6'; this repo's HF0.6 print profiles (vendor/hyigerINDX.ini), test printed; 0.32 Draft is left out because HF0.4 on tools 1-7 cannot print 0.32
#   0.25mm Balanced ★ @COREONEINDX 0.6HF: from '0.25mm Balanced ★ @COREONEINDX HF0.6'; this repo's HF0.6 print profiles (vendor/hyigerINDX.ini), test printed; 0.32 Draft is left out because HF0.4 on tools 1-7 cannot print 0.32
# 2.9 values these presets cannot carry, because PrusaSlicer 3 has the key
# for the whole print only (one value for all tools):
#   0.07mm Extra Fine @COREONEINDX 0.25: output_filename_format = '{input_filename_base}_0.25n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode' not carried (print-only in PrusaSlicer 3, which uses '{input_filename_base}_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode')
#   0.07mm Extra Fine @COREONEINDX 0.25: wipe_tower_brim_width = 2 not carried (print-only in PrusaSlicer 3, which uses 3)
#   0.07mm Extra Fine @COREONEINDX 0.25: mmu_segmented_region_max_width = 5 not carried (print-only in PrusaSlicer 3, which uses 0)
#   0.10mm Fine ★ @COREONEINDX 0.25: output_filename_format = '{input_filename_base}_0.25n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode' not carried (print-only in PrusaSlicer 3, which uses '{input_filename_base}_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode')
#   0.10mm Fine ★ @COREONEINDX 0.25: wipe_tower_brim_width = 2 not carried (print-only in PrusaSlicer 3, which uses 3)
#   0.10mm Fine ★ @COREONEINDX 0.25: mmu_segmented_region_max_width = 5 not carried (print-only in PrusaSlicer 3, which uses 0)
#   0.15mm Detail @COREONEINDX 0.25: output_filename_format = '{input_filename_base}_0.25n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode' not carried (print-only in PrusaSlicer 3, which uses '{input_filename_base}_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode')
#   0.15mm Detail @COREONEINDX 0.25: wipe_tower_brim_width = 2 not carried (print-only in PrusaSlicer 3, which uses 3)
#   0.15mm Detail @COREONEINDX 0.25: mmu_segmented_region_max_width = 5 not carried (print-only in PrusaSlicer 3, which uses 0)
#   0.20mm Detail @COREONEINDX 0.6HF: mmu_segmented_region_max_width = 5 not carried (print-only in PrusaSlicer 3, which uses 0)
#   0.20mm Detail @COREONEINDX 0.6HF: output_filename_format = '{input_filename_base}_0.6n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode' not carried (print-only in PrusaSlicer 3, which uses '{input_filename_base}_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode')
#   0.20mm Detail @COREONEINDX 0.6HF: wipe_tower_brim_width = 2 not carried (print-only in PrusaSlicer 3, which uses 3)
#   0.25mm Balanced ★ @COREONEINDX 0.6HF: mmu_segmented_region_max_width = 5 not carried (print-only in PrusaSlicer 3, which uses 0)
#   0.25mm Balanced ★ @COREONEINDX 0.6HF: output_filename_format = '{input_filename_base}_0.6n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode' not carried (print-only in PrusaSlicer 3, which uses '{input_filename_base}_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode')
