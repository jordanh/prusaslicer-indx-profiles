# UNVALIDATED: nothing in this vendor has been printed with PrusaSlicer 3 yet.
# vendor.yaml for hyigerINDX, generated by tools/build_ps3_vendor.py from Prusa
# Research FFF profiles 1.0.20. The vendor features and sheets are Prusa's;
# the printer is Prusa's COREONE_INDX definition with tool_count 8 and:
#   supports_non_high_flow_nozzle: True (tool 8 may hold the standard 0.4 or 0.25)
#   supports_025_nozzle: True (tool 8 may hold the 0.25)
#   supports_06_nozzle: True (tool 8 may hold the HF0.6)
# Tools (all bound to this printer):
#   0.4HF: Prusa's stock INDX tool: tools 1-7, and tool 8's default
#   0.4: Bondtech INDX passive tool 0.4 for flexibles: standard flow, no CHT (bondtech.se/product/indx-passive-tool-0-4mm-flexibles)
#   0.6HF: Bondtech INDX CHT tool 0.6: high-flow CHT (bondtech.se/product/bondtech-indx-cht-tool)
#   0.25: Bondtech INDX fine nozzle 0.25: standard single bore (bondtech.se/product/bondtech-indx-fine-nozzle)
# printer_config c1indx-8t-jrh: tools 1-8 start as 0.4HF; pick tool 8 per session (alpha12 does not save it, prusa3d/PrusaSlicer#15737).
kind: vendor
id: hyigerINDX
name: hyiger INDX
version: 0.1.0
features:
  printer:
    supports_high_flow_nozzle:
      default: true
      user_editable: false
    supports_non_high_flow_nozzle:
      default: true
      user_editable: false
    input_shaper:
      default: false
      user_editable: false
    planetary_gearbox:
      default: true
      user_editable: false
    supports_025_nozzle:
      default: true
    supports_03_nozzle:
      default: true
    supports_04_nozzle:
      default: true
    supports_05_nozzle:
      default: true
    supports_06_nozzle:
      default: true
    supports_08_nozzle:
      default: true
    supports_mmu_025_nozzle:
      default: false
    supports_mmu_03_nozzle:
      default: false
    supports_mmu_04_nozzle:
      default: false
    supports_mmu_05_nozzle:
      default: false
    supports_mmu_06_nozzle:
      default: false
    supports_mmu_08_nozzle:
      default: false
    bed_segments_x:
      default: 1
    bed_segments_y:
      default: 1
    auxiliary_travel_anchor_x:
      default: -1
    auxiliary_travel_anchor_y:
      default: -1
    supports_tool_preheating:
      default: false
    multi_extruder:
      default: false
  tool:
    nozzle_high_flow:
      default: false
      user_editable: false
    nozzle_diameter:
      default: 0.4
      user_editable: false
  sheet:
    cold:
      default: false
      user_editable: false
  feeder:
    single_mode:
      default: false
printer_families:
- label: Core ONE INDX JRH
  base_model: COREONE_INDX
  printer_configs_order:
  - c1indx-8t-jrh
