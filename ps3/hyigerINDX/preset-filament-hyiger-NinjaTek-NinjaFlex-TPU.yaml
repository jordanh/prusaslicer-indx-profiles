    filament_notes: "INDX 0.4 standard-flow preset from Prusa's draft NinjaTek NinjaFlex TPU @COREONEINDX, resolved: Prusa's own unreleased INDX draft for NinjaFlex (85A). As Prusa's released INDX flexibles: start_filament_gcode, filament_multitool_ramming_flow, filament_minimal_purge_on_wipe_tower, filament_retract_length, filament_travel_ramping_lift. MVS 2.4 = 3 (NinjaTek NinjaFlex TPU @COREONE) x 0.8, the INDX / CORE One ratio of both Generic FLEX @COREONEINDX HF0.4 and Prusament TPU 95A @COREONEINDX HF0.4; the draft types 3. Maker range: within ninjatek.com/shop/ninjaflex and ninjatek.com/printing-guidelines (MVS = 18 mm/s at 0.45 x 0.20 mm). Calibrated, from hyiger's calibration prints, CORE One INDX tool 8 with Bondtech's Standard Flow 0.4, PrusaSlicer 3.0.0-alpha12, 2026-11-09: temperature 230 (derived 238): temperature tower: 230 printed best; a calibration cube then printed cleanly at it; first_layer_temperature 230 (derived 238): kept at the printing temperature; the calibration cube's first layer held on the 50 C bed; filament_max_volumetric_speed 1.5 (derived 2.4): Erik's Flow Ratio test failed twice at the derived 2.4, its first layer running about 3.1 mm3/s past the cap, and the TPU tangled at the extruder gear; 1.5 rules speed out and the calibration cube printed cleanly. A floor rather than a measured limit; filament_retract_length 0.2 (derived 1.5): SemiFlex's retraction-tower result, taken as the start for the softer 85A; the calibration cube printed cleanly with it. No retraction tower printed yet; filament_retract_speed 25 (derived 60): lowered from the released 95A flexibles' 60 so the soft 85A is not pulled hard through the gear; the calibration cube printed cleanly with it. Not tested on its own; max_fan_speed 55 (derived 50): set in hyiger's test preset; the calibration cube printed cleanly with it; no test recorded for it; bridge_fan_speed 70 (derived 60): as max_fan_speed. No finished part printed yet."
    filament_purge_multiplier: 100%
    filament_ramming_parameters: 120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6
