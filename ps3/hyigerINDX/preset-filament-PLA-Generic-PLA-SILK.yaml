# UNVALIDATED: nothing in this vendor has been printed with PrusaSlicer 3 yet.
# Prusa Research FFF 1.0.20 preset-filament-PLA-Generic-PLA-SILK.yaml, copied by tools/build_ps3_vendor.py; a leading *quit* variant is
# added to each material listed here:
#   Generic PLA Silk (preset-filament-PLA-Generic-PLA-SILK.yaml): Prusa's INDX branch for this material has no '*quit*', so on a nozzle Prusa has no INDX profile for it falls through to a preset tuned for none; hidden there, at 0.25, 0.6HF
kind: filament
inherits:
- '*PLASILK*'
name: Generic PLA Silk
id: Generic PLA Silk
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI|COREONE_INDX)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode)
values:
  filament_cost: '19.99'
  filament_vendor: Generic
variants:
- condition: printer.base_model == "COREONE_INDX" and tool.nozzle_diameter != 0.4
  name: "*quit*"
  id: 1wZ82/bjWcOqtXK55kR+8A
