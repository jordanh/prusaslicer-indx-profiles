# UNVALIDATED: nothing in this vendor has been printed with PrusaSlicer 3 yet.
# Prusa Research FFF 1.0.20 preset-filament-PLA-Prusament-PLA-Blend.yaml, copied by tools/build_ps3_vendor.py; a leading *quit* variant is
# added to each material listed here:
#   Prusament PLA Blend (preset-filament-PLA-Prusament-PLA-Blend.yaml): Prusa's INDX branch for this material has no '*quit*', so on a nozzle Prusa has no INDX profile for it falls through to a preset tuned for none; hidden there, at 0.25, 0.6HF
kind: filament
inherits:
- '*PLASILK*'
name: Prusament PLA Blend
id: Prusament PLA Blend
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI|COREONE_INDX)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode)
values:
  filament_cost: '27.99'
  filament_vendor: Prusa Polymers
variants:
- condition: printer.base_model == "COREONE_INDX" and tool.nozzle_diameter != 0.4
  name: "*quit*"
  id: 0c0WlhVQULa/efLJxcvCUw
  ## C1 INDX
- condition: printer.base_model == "COREONE_INDX"
  id: kr6qwFS2QkSa1o8VlGYCzQ
  values:
    first_layer_temperature: 230
    temperature: 225
  variants:
  # C1 INDX 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 0lsyKurlQ4SPU90eHzrSAQ
    values:
      filament_max_volumetric_speed: 12.5
      slowdown_below_layer_time: 12
      pressure_advance_value: 0.032
      filament_infill_max_crossing_speed: 130
    variants:
    # C1 INDX HF0.4
    - condition: tool.nozzle_high_flow
      id: jHUNG0hxQ3CCIYv/UO+GVw
      values:
        filament_max_volumetric_speed: 12.5
